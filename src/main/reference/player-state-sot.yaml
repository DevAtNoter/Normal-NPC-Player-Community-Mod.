schema:
  id: nnp.player-state-sot
  version: 1.0.0
  minecraft: 1.20.1
  loader: Forge 47.x / 1.20.1
  purpose: Canonical configurable schema for NNP Player State, Stats and Abilities.
  authority:
  - 'Vanilla/Forge Player inheritance chain: Entity -> LivingEntity -> Player'
  - Minecraft runtime state is authoritative; NNP derived state must never overwrite native state unless explicitly configured.
  - Forge Capabilities are dynamic extension points and are not assumed to have a fixed schema.
  field_contract:
  - type
  - default
  - min
  - max
  - configurable
  - readOnly
  - serverOnly
  - clientOnly
  - persistent
  - aiRelevant
  config_rules:
    readOnly: When true, NNP must not directly mutate the field through the SOT adapter.
    configurable: When true, a profile/config may override the value subject to Minecraft validity rules.
    serverOnly: State must be sourced from authoritative server runtime.
    clientOnly: State is presentation/input/interpolation and must not be used as authoritative gameplay state.
    persistent: State is expected to survive save/load when vanilla supports persistence; runtime-only fields are false.
    aiRelevant: Expose the field to NNP perception/decision systems by default.
  source:
    forge_player_javadocs: https://lexxie.dev/forge/1.20.1/net/minecraft/world/entity/player/Player.html
    forge_livingentity_javadocs: https://lexxie.dev/forge/1.20.1/net/minecraft/world/entity/LivingEntity.html
    forge_entity_javadocs: https://lexxie.dev/forge/1.20.1/net/minecraft/world/entity/Entity.html
    forge_capabilities: https://docs.minecraftforge.net/en/1.20.1/datastorage/capabilities/
  completeness: This file inventories Player-owned fields plus inherited Entity/LivingEntity runtime fields, stable structured
    state exposed by NNP, attribute/effect schemas, environment sensors, and AI-derived state. Static compile-time constants
    and logger objects are intentionally excluded from mutable state. Client interpolation/render-only fields are retained
    where they are actual runtime fields, but marked clientOnly/aiRelevant=false.
profiles:
  vanilla_player:
    description: Read native state; do not change Minecraft defaults.
    allow_native_mutation: false
    allow_attribute_override: false
    allow_ability_override: false
    allow_capability_override: false
  nnp_adult:
    description: NNP adult profile.
    allow_native_mutation: true
    allow_attribute_override: true
    allow_ability_override: true
    allow_capability_override: true
  nnp_child:
    description: GrowthChild-compatible profile; values are examples, not hard-coded gameplay rules.
    allow_native_mutation: true
    allow_attribute_override: true
    allow_ability_override: true
    allow_capability_override: true
